name: update readme cards

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

concurrency:
  group: profile-assets-${{ github.ref }}
  cancel-in-progress: false

jobs:
  google-play:
    if: >-
      github.ref == 'refs/heads/master' &&
      vars.GOOGLE_PLAY_REPORTS_BUCKET != '' &&
      vars.GOOGLE_PLAY_IDENTITY_PROVIDER != '' &&
      vars.GOOGLE_PLAY_SERVICE_ACCOUNT != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      summary: ${{ steps.collect.outputs.summary }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-profile
      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GOOGLE_PLAY_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GOOGLE_PLAY_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/devstorage.read_only
          create_credentials_file: false
          export_environment_variables: false
      - id: collect
        name: Read Google Play installation reports
        env:
          GOOGLE_PLAY_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          GOOGLE_PLAY_REPORTS_BUCKET: ${{ vars.GOOGLE_PLAY_REPORTS_BUCKET }}
        working-directory: scripts/profile
        run: |
          poetry run profile-badges google-play --output "$RUNNER_TEMP/installs.json"
          jq -c -r '"summary=" + tojson' "$RUNNER_TEMP/installs.json" >> "$GITHUB_OUTPUT"

  build:
    needs: google-play
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-profile
        with:
          groups: main,test

      - name: Check Python style
        working-directory: scripts/profile
        run: |
          poetry run ruff check .
          poetry run ruff format --check .

      - name: Test the profile generator
        working-directory: scripts/profile
        run: poetry run pytest

      - name: Generate profile badges and download details
        env:
          GH_TOKEN: ${{ github.token }}
          PROFILE_STORE_RESULT: ${{ needs.google-play.outputs.summary }}
          PROFILE_STORE_JOB: ${{ needs.google-play.result }}
        working-directory: scripts/profile
        run: poetry run profile-badges generate

      - name: generate stats card (light)
        continue-on-error: true
        uses: stats-organization/github-readme-stats-action@v2
        with:
          fail_on_error: true
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&rank_icon=percentile&theme=default
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: generate stats card (dark)
        continue-on-error: true
        uses: stats-organization/github-readme-stats-action@v2
        with:
          fail_on_error: true
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&rank_icon=percentile&theme=github_dark
          path: profile/stats-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: generate top languages card (light)
        continue-on-error: true
        uses: stats-organization/github-readme-stats-action@v2
        with:
          fail_on_error: true
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&theme=default
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: generate top languages card (dark)
        continue-on-error: true
        uses: stats-organization/github-readme-stats-action@v2
        with:
          fail_on_error: true
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&theme=github_dark
          path: profile/top-langs-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish profile assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- README.md profile/
          if ! git diff --cached --quiet; then
            git commit -m "Update profile metrics and cards"
            git push
          fi
